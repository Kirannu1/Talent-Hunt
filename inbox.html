<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inbox — MindMesh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a class="logo" href="index.html">
      <svg class="logo-mark" viewBox="0 0 26 26" fill="none">
        <circle cx="6" cy="7" r="3" fill="#6C4CE0"/>
        <circle cx="20" cy="6" r="2.4" fill="#FF9F45"/>
        <circle cx="19" cy="19" r="3.2" fill="#6C4CE0"/>
        <circle cx="6" cy="19" r="2.2" fill="#FF9F45"/>
        <path d="M6 7L20 6M6 7L19 19M20 6L19 19M6 7L6 19M6 19L19 19" stroke="#12161C" stroke-width="1" stroke-opacity="0.55"/>
      </svg>
      MindMesh
    </a>
    <nav class="nav-links">
      <a href="index.html#how">How it works</a>
      <a href="index.html#synthesizer">AI Studio</a>
      <a href="ideas.html">Ideas</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="team.html">My Team</a>
      <a class="active" href="inbox.html">Inbox <span class="inbox-badge" id="nav-inbox-badge" style="display:none;">1</span></a>
    </nav>
    <div class="nav-right">
      <div id="auth-widget"></div>
      <a class="nav-cta" href="team.html">My Team</a>
    </div>
  </div>
</header>

<section class="page-hero" style="padding-bottom:0;">
  <div class="wrap">
    <span class="kicker mono">Inbox</span>
    <h1>Every conversation, in one place.</h1>
    <p>Anyone who's messaged you shows up here — even if you haven't added them to your team yet.</p>
  </div>
</section>

<div class="wrap" style="padding:44px 32px 100px;max-width:820px;">
  <div id="cloud-banner" class="empty-note" style="display:none;"></div>
  <div id="inbox-container">
    <div class="skel skel-card"></div>
    <div class="skel skel-card"></div>
  </div>
</div>

<footer>
  <div class="wrap">
    <div class="foot-bottom">
      <span>© 2026 MindMesh. Built by students, for students.</span>
      <span class="mono">status: mesh online</span>
    </div>
  </div>
</footer>

<script src="assets/app.js"></script>
<script src="assets/sfx.js"></script>
<script src="assets/toast.js"></script>
<script src="assets/copilot.js"></script>
<script src="assets/polish.js"></script>
<script type="module" src="assets/auth-widget.js"></script>
<script type="module">
import {
  isCloudReady, getMyUid, loadAllProfilesCloud, subscribeMyThreads,
  otherParticipant, isThreadUnread, markThreadRead, sendMessage, subscribeThread, whenAuthReady
} from './assets/cloud.js';

(async function(){
  await whenAuthReady();
  const container = document.getElementById('inbox-container');
  const myUid = getMyUid();
  const myProfile = JSON.parse(localStorage.getItem('mindmesh_profile') || '{}');
  const squad = (myProfile && myProfile.team) ? Object.values(myProfile.team) : [];

  // uid -> {name, photo, college} lookup, built from real profiles + squad + mock roster
  const directory = {};
  (MindMesh.MOCK_STUDENTS || []).forEach(s => { directory[s.uid] = s; });
  squad.forEach(s => { directory[s.uid] = s; });
  if (isCloudReady()){
    (await loadAllProfilesCloud()).forEach(p => { directory[p.uid] = p; });
  }

  const openThreads = {}; // otherUid -> unsubscribe fn for its message stream
  const urlParams = new URLSearchParams(window.location.search);
  const autoChatUid = urlParams.get('chat');

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function timeAgo(ts){
    if (!ts) return '';
    const diff = Date.now() - ts;
    const mins = Math.floor(diff / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + 'm ago';
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + 'h ago';
    return Math.floor(hrs / 24) + 'd ago';
  }

  // Render top Squad Quick-Chat Bar
  function renderSquadBar() {
    let squadBar = document.getElementById('squad-quick-chat-bar');
    if (!squadBar) {
      squadBar = document.createElement('div');
      squadBar.id = 'squad-quick-chat-bar';
      squadBar.style.cssText = 'background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-bottom:24px;box-shadow:0 4px 16px rgba(18,22,28,0.03);';
      container.parentNode.insertBefore(squadBar, container);
    }

    if (squad.length === 0) {
      squadBar.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
          <div>
            <b style="font-size:14px;color:var(--ink);">Squad Direct Messaging</b>
            <div style="font-size:12px;color:var(--ink-soft);margin-top:2px;">Add teammates from your dashboard to text them directly.</div>
          </div>
          <a href="dashboard.html" class="btn-outline" style="padding:7px 14px;font-size:12px;text-decoration:none;border-radius:99px;">Find Teammates →</a>
        </div>`;
      return;
    }

    squadBar.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px;">
        <div style="display:flex;align-items:center;gap:8px;">
          <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#3FA772;box-shadow:0 0 8px #3FA772;"></span>
          <b style="font-size:14px;color:var(--ink);">Message Your Selected Squad (${squad.length} teammate${squad.length === 1 ? '' : 's'})</b>
        </div>
        <a href="team.html" style="font-size:12px;color:var(--violet);font-weight:600;text-decoration:none;">Manage Squad →</a>
      </div>
      <div style="display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;">
        ${squad.map(mate => `
          <button type="button" class="squad-mate-chip" data-uid="${mate.uid}" style="display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);padding:7px 14px;border-radius:99px;cursor:pointer;font-family:inherit;font-size:12.5px;color:var(--ink);transition:all .15s;white-space:nowrap;">
            <span style="display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--violet);color:#fff;font-size:10px;font-weight:700;overflow:hidden;flex:none;">
              ${mate.photo ? `<img src="${mate.photo}" style="width:100%;height:100%;object-fit:cover;">` : MindMesh.initials(mate.name)}
            </span>
            <b>${MindMesh.escapeHtml(mate.name.split(' ')[0])}</b>
            <span style="font-size:11px;color:var(--violet);font-weight:600;">💬 Chat</span>
          </button>
        `).join('')}
      </div>`;

    squadBar.querySelectorAll('.squad-mate-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        const uid = btn.dataset.uid;
        openOrStartChat(uid);
      });
    });
  }

  async function openOrStartChat(otherUid) {
    const existingRow = document.querySelector(`.inbox-row[data-other-uid="${otherUid}"]`);
    if (existingRow) {
      const panel = existingRow.parentElement.querySelector('.inbox-chat-panel');
      if (panel && !panel.classList.contains('open')) {
        existingRow.click();
      }
      existingRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
    } else {
      // Start fresh chat thread
      const person = directory[otherUid] || { name: 'Teammate' };
      const firstName = person.name ? person.name.split(' ')[0] : 'Teammate';
      await sendMessage(otherUid, `Hi ${firstName}! Let's connect on MindMesh.`);
      // Allow thread subscription to pick it up and open
      setTimeout(() => {
        const newRow = document.querySelector(`.inbox-row[data-other-uid="${otherUid}"]`);
        if (newRow) newRow.click();
      }, 350);
    }
  }

  renderSquadBar();

  function renderInbox(threads){
    if (!threads || threads.length === 0){
      container.innerHTML = `
        <div class="empty-inbox" style="padding:40px 24px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:18px;">
          <div style="font-size:36px;margin-bottom:12px;">💬</div>
          <h3 style="margin-bottom:8px;font-size:19px;">Your Inbox is Ready</h3>
          <p style="max-width:44ch;margin:0 auto 20px;color:var(--ink-soft);font-size:14px;">Select any teammate from your squad above to send your first message, or visit <a href="team.html" style="color:var(--violet);font-weight:600;">My Team</a> to start a sprint.</p>
          ${squad.length > 0 ? `
            <div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;">
              ${squad.map(m => `
                <button type="button" class="btn-primary start-chat-btn" data-uid="${m.uid}" style="padding:8px 16px;font-size:13px;border-radius:99px;display:inline-flex;align-items:center;gap:6px;">
                  💬 Chat with ${MindMesh.escapeHtml(m.name.split(' ')[0])}
                </button>
              `).join('')}
            </div>
          ` : `
            <a href="dashboard.html" class="btn-primary" style="display:inline-block;padding:9px 20px;font-size:13px;text-decoration:none;border-radius:99px;">Explore Teammates</a>
          `}
        </div>`;

      container.querySelectorAll('.start-chat-btn').forEach(b => {
        b.addEventListener('click', () => openOrStartChat(b.dataset.uid));
      });
      return;
    }

    container.innerHTML = `<div class="inbox-list" id="inbox-list" style="display:flex;flex-direction:column;gap:14px;"></div>`;
    const list = document.getElementById('inbox-list');

    threads.forEach((thread, idx) => {
      const otherUid = otherParticipant(thread);
      if (!otherUid) return;

      // Check multiple sources for person metadata
      const details = (thread.participantDetails && thread.participantDetails[otherUid]) || {};
      const person = directory[otherUid] || {
        name: details.name || 'Teammate',
        photo: details.photo || null,
        college: details.college || ''
      };

      const unread = isThreadUnread(thread);
      const last = thread.lastMessage;
      const previewPrefix = last && last.from === myUid ? 'You: ' : '';
      const firstName = person.name ? person.name.split(' ')[0] : 'Teammate';

      const wrapper = document.createElement('div');
      wrapper.className = 'inbox-card-wrap' + (unread ? ' unread' : '');
      wrapper.style.cssText = 'background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:all .2s ease;box-shadow:0 4px 14px rgba(18,22,28,0.03);';

      const row = document.createElement('div');
      row.className = 'inbox-row' + (unread ? ' unread' : '');
      row.dataset.otherUid = otherUid;
      row.style.animationDelay = (idx * 0.05) + 's';
      row.style.cssText = 'padding:16px 20px;display:flex;align-items:center;gap:14px;cursor:pointer;background:transparent;border:none;border-radius:0;';
      row.innerHTML = `
        <div class="avatar" style="background:${idx % 2 === 0 ? 'var(--violet)' : 'var(--amber)'};width:42px;height:42px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;flex:none;">${
          person.photo ? `<img src="${person.photo}" style="width:100%;height:100%;object-fit:cover;">` : MindMesh.initials(person.name)
        }</div>
        <div class="info" style="flex:1;min-width:0;">
          <div class="name-row" style="display:flex;align-items:center;gap:8px;">
            <b style="font-size:15px;color:var(--ink);">${MindMesh.escapeHtml(person.name)}</b>
            ${person.college ? `<span style="font-size:11.5px;color:var(--ink-faint);font-weight:400;">(${MindMesh.escapeHtml(person.college.split(' ')[0])})</span>` : ''}
            ${unread ? '<span class="unread-dot"></span>' : ''}
          </div>
          <div class="preview" style="font-size:13px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px;">
            ${previewPrefix}${escapeHtml(last ? last.text : 'No messages yet')}
          </div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none;">
          <span class="inbox-time" style="font-size:11px;color:var(--ink-faint);">${timeAgo(last && last.createdAt)}</span>
          <span class="reply-hint" style="font-size:11.5px;color:var(--violet);font-weight:600;display:inline-flex;align-items:center;gap:2px;">Reply ▾</span>
        </div>`;

      const chatPanel = document.createElement('div');
      chatPanel.className = 'inbox-chat-panel';
      chatPanel.style.cssText = 'border-top:1px solid var(--line);background:var(--bg);display:none;';
      chatPanel.innerHTML = `
        <div class="inbox-chat-header" style="display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:#fff;border-bottom:1px solid var(--line);">
          <div style="display:flex;align-items:center;gap:10px;">
            <div style="width:30px;height:30px;border-radius:50%;overflow:hidden;background:var(--violet);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;">
              ${person.photo ? `<img src="${person.photo}" style="width:100%;height:100%;object-fit:cover;">` : MindMesh.initials(person.name)}
            </div>
            <div>
              <b style="font-size:13.5px;color:var(--ink);">${MindMesh.escapeHtml(person.name)}</b>
              <span style="font-size:11.5px;color:var(--ink-faint);margin-left:6px;">${person.college ? MindMesh.escapeHtml(person.college.split(' ')[0]) : ''}</span>
            </div>
          </div>
          <span style="display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#2F855A;font-weight:600;background:rgba(63,167,114,0.1);padding:3px 8px;border-radius:99px;">
            <span style="width:6px;height:6px;border-radius:50%;background:#3FA772;"></span> Active on Mesh
          </span>
        </div>

        <div class="chat-messages" style="max-height:300px;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px;">
          <div class="chat-empty">Loading conversation…</div>
        </div>

        <div class="chat-typing-row" id="inbox-typing-${otherUid}" style="display:none;font-size:11.5px;color:var(--violet);margin:4px 0 6px 20px;font-weight:600;">
          <span class="copilot-dot"></span> ${MindMesh.escapeHtml(firstName)} is typing…
        </div>

        <!-- Icebreaker chips -->
        <div class="inbox-starters" style="display:flex;gap:6px;overflow-x:auto;padding:8px 16px;background:rgba(255,255,255,0.7);border-top:1px solid var(--line);scrollbar-width:none;">
          <button type="button" class="copilot-chip starter-chip">👋 Say hi!</button>
          <button type="button" class="copilot-chip starter-chip">🚀 Ready for SIH 2026?</button>
          <button type="button" class="copilot-chip starter-chip">💻 What tech stack should we use?</button>
          <button type="button" class="copilot-chip starter-chip">🎨 Let's finalize UI designs</button>
        </div>

        <!-- Dedicated Reply Bar -->
        <div class="chat-input-row" style="padding:12px 18px;background:#fff;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;">
          <input type="text" placeholder="Type your reply to ${escapeHtml(firstName)}..." autocomplete="off" maxlength="500" style="flex:1;padding:10px 16px;border-radius:99px;border:1px solid var(--line);font-size:13.5px;">
          <button type="button" class="btn-primary send-reply-btn" style="padding:10px 20px;border-radius:99px;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;">
            Reply ↗
          </button>
        </div>`;

      wrapper.appendChild(row);
      wrapper.appendChild(chatPanel);
      list.appendChild(wrapper);

      const chatMessages = chatPanel.querySelector('.chat-messages');
      const chatInput = chatPanel.querySelector('input');
      const chatSend = chatPanel.querySelector('.send-reply-btn');
      const replyHint = row.querySelector('.reply-hint');
      const typingIndicator = chatPanel.querySelector(`#inbox-typing-${otherUid}`);

      // Handle icebreaker starters
      chatPanel.querySelectorAll('.starter-chip').forEach(chip => {
        chip.addEventListener('click', (e) => {
          e.stopPropagation();
          const text = chip.textContent.replace(/^[^\w]+/, '').trim();
          chatInput.value = text;
          chatInput.focus();
        });
      });

      function renderMessages(messages){
        if (typingIndicator) typingIndicator.style.display = 'none';
        if (!messages || messages.length === 0){
          chatMessages.innerHTML = `<div class="chat-empty" style="color:var(--ink-soft);font-size:13px;text-align:center;padding:24px 0;">Say hi to ${escapeHtml(firstName)} 👋</div>`;
          return;
        }

        chatMessages.innerHTML = messages.map(m => {
          const isMine = m.from === myUid;
          const photoUrl = isMine
            ? ((cachedUser && cachedUser.photoURL) || myProfile.photo || null)
            : (m.senderPhoto || person.photo || null);
          const avatarMarkup = photoUrl
            ? `<img src="${photoUrl}" style="width:100%;height:100%;object-fit:cover;">`
            : MindMesh.initials(isMine ? 'YOU' : (m.senderName || person.name || 'Teammate'));

          const timeString = m.createdAt ? new Date(m.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';

          return `
            <div class="chat-bubble-wrap" style="display:flex;align-items:flex-end;gap:8px;${isMine ? 'justify-content:flex-end;' : 'justify-content:flex-start;'}">
              ${!isMine ? `
                <div style="width:26px;height:26px;border-radius:50%;overflow:hidden;background:var(--violet);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;margin-bottom:2px;">
                  ${avatarMarkup}
                </div>` : ''
              }
              <div class="chat-bubble ${isMine ? 'mine' : 'theirs'}" style="max-width:75%;padding:10px 14px;border-radius:14px;font-size:13.5px;line-height:1.45;${isMine ? 'background:linear-gradient(100deg, var(--amber-tint), var(--violet-tint));color:var(--violet-deep);border-bottom-right-radius:4px;' : 'background:#fff;border:1px solid var(--line);color:var(--ink);border-bottom-left-radius:4px;'}">
                <div style="font-size:10.5px;font-weight:700;margin-bottom:3px;opacity:0.75;">
                  ${isMine ? 'You' : escapeHtml(m.senderName ? m.senderName.split(' ')[0] : firstName)}
                </div>
                <div>${escapeHtml(m.text)}</div>
                <div style="font-size:10px;opacity:0.55;margin-top:4px;text-align:right;">${timeString}</div>
              </div>
              ${isMine ? `
                <div style="width:26px;height:26px;border-radius:50%;overflow:hidden;background:var(--amber);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;margin-bottom:2px;">
                  ${avatarMarkup}
                </div>` : ''
              }
            </div>
          `;
        }).join('');
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      row.addEventListener('click', async () => {
        const opening = !chatPanel.classList.contains('open');
        chatPanel.classList.toggle('open');
        chatPanel.style.display = opening ? 'block' : 'none';
        if (replyHint) replyHint.textContent = opening ? 'Close ▴' : 'Reply ▾';

        if (opening){
          row.classList.remove('unread');
          wrapper.style.borderColor = 'var(--violet)';
          const dot = row.querySelector('.unread-dot');
          if (dot) dot.remove();
          await markThreadRead(otherUid);
          if (!openThreads[otherUid]){
            openThreads[otherUid] = subscribeThread(otherUid, renderMessages);
          }
          setTimeout(() => chatInput.focus(), 150);
        } else {
          wrapper.style.borderColor = 'var(--line)';
        }
      });

      async function doSend(){
        const text = chatInput.value;
        if (!text.trim()) return;
        chatInput.value = '';
        if (window.MindMeshSFX) window.MindMeshSFX.playClick();
        await sendMessage(otherUid, text);
        chatInput.focus();

        if (typingIndicator && (otherUid.startsWith('s1_') || otherUid.startsWith('s2_') || otherUid.startsWith('s3_') || otherUid.startsWith('s4_') || otherUid.startsWith('mock_'))) {
          setTimeout(() => {
            typingIndicator.style.display = 'block';
            chatMessages.scrollTop = chatMessages.scrollHeight;
          }, 400);
        }
      }

      chatSend.addEventListener('click', (e) => { e.stopPropagation(); doSend(); });
      chatInput.addEventListener('click', (e) => e.stopPropagation());
      chatInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          doSend();
        }
      });

      // If user came via ?chat=<uid>, automatically open this thread
      if (autoChatUid && otherUid === autoChatUid) {
        setTimeout(() => {
          if (!chatPanel.classList.contains('open')) row.click();
        }, 300);
      }
    });
  }

  subscribeMyThreads(renderInbox);
})();
</script>
</body>
</html>
