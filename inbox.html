<script src="assets/app.js"></script>

<script src="assets/polish.js"></script>

<script type="module">
import {
  isCloudReady, getMyUid, loadAllProfilesCloud, subscribeMyThreads,
  otherParticipant, isThreadUnread, markThreadRead, sendMessage, subscribeThread, whenAuthReady
} from './assets/cloud.js';

(async function(){
  await whenAuthReady();
  // Hybrid messaging works locally and seamlessly syncs to cloud
  const container = document.getElementById('inbox-container');
  const myUid = getMyUid();

  // uid -> {name, photo} lookup, built from real profiles + the mock roster
  const directory = {};
  (MindMesh.MOCK_STUDENTS || []).forEach(s => { directory[s.uid] = s; });
  if (isCloudReady()){
    (await loadAllProfilesCloud()).forEach(p => { directory[p.uid] = p; });
  }

  const openThreads = {}; // otherUid -> unsubscribe fn for its message stream

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function timeAgo(ts){
    if (!ts) return '';
    const diff = Date.now() - ts;
    const mins = Math.floor(diff / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + 'm ago';
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + 'h ago';
    return Math.floor(hrs / 24) + 'd ago';
  }

  function renderInbox(threads){
    if (!threads || threads.length === 0){
      container.innerHTML = `
        <div class="empty-inbox">
          <h3 style="margin-bottom:10px;font-size:19px;">No messages yet</h3>
          <p style="max-width:44ch;margin:0 auto;">Once you or a matched teammate sends the first message from <a href="team.html">My Team</a>, it'll show up here.</p>
        </div>`;
      return;
    }

    container.innerHTML = `<div class="inbox-list" id="inbox-list"></div>`;
    const list = document.getElementById('inbox-list');

    threads.forEach((thread, idx) => {
      const otherUid = otherParticipant(thread);
      if (!otherUid) return;
      const person = directory[otherUid] || { name: 'Teammate', year: '' };
      const unread = isThreadUnread(thread);
      const last = thread.lastMessage;
      const previewPrefix = last && last.from === myUid ? 'You: ' : '';
      const firstName = person.name ? person.name.split(' ')[0] : 'Teammate';

      const row = document.createElement('div');
      row.className = 'inbox-row' + (unread ? ' unread' : '');
      row.style.animationDelay = (idx * 0.05) + 's';
      row.innerHTML = `
        <div class="avatar" style="background:${idx % 2 === 0 ? 'var(--violet)' : 'var(--amber)'};">${
          person.photo ? `<img src="${person.photo}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">` : MindMesh.initials(person.name)
        }</div>
        <div class="info">
          <div class="name-row"><b>${person.name}</b>${unread ? '<span class="unread-dot"></span>' : ''}</div>
          <div class="preview">${previewPrefix}${escapeHtml(last ? last.text : 'No messages yet')}</div>
        </div>
        <span class="inbox-time">${timeAgo(last && last.createdAt)}</span>`;

      const chatPanel = document.createElement('div');
      chatPanel.className = 'inbox-chat-panel';
      chatPanel.innerHTML = `
        <div class="chat-messages"><div class="chat-empty">Loading…</div></div>
        <div class="chat-typing-row" id="inbox-typing-${otherUid}" style="display:none;font-size:11.5px;color:var(--violet);margin:6px 0 8px 12px;font-weight:600;">
          <span class="copilot-dot"></span> ${firstName} is typing…
        </div>
        <div class="chat-input-row">
          <input type="text" placeholder="Write a message to ${firstName}…" maxlength="500">
          <button type="button">Send</button>
        </div>`;

      const wrapper = document.createElement('div');
      wrapper.appendChild(row);
      wrapper.appendChild(chatPanel);
      list.appendChild(wrapper);

      const chatMessages = chatPanel.querySelector('.chat-messages');
      const chatInput = chatPanel.querySelector('input');
      const chatSend = chatPanel.querySelector('button');
      const typingIndicator = chatPanel.querySelector(`#inbox-typing-${otherUid}`);

      function renderMessages(messages){
        if (typingIndicator) typingIndicator.style.display = 'none';
        if (!messages || messages.length === 0){
          chatMessages.innerHTML = `<div class="chat-empty">Say hi to ${firstName} 👋</div>`;
          return;
        }
        chatMessages.innerHTML = messages.map(m =>
          `<div class="chat-bubble ${m.from === myUid ? 'mine' : 'theirs'}">${escapeHtml(m.text)}</div>`
        ).join('');
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      row.addEventListener('click', async () => {
        const opening = !chatPanel.classList.contains('open');
        chatPanel.classList.toggle('open');
        if (opening){
          row.classList.remove('unread');
          const dot = row.querySelector('.unread-dot');
          if (dot) dot.remove();
          await markThreadRead(otherUid);
          if (!openThreads[otherUid]){
            openThreads[otherUid] = subscribeThread(otherUid, renderMessages);
          }
          setTimeout(() => chatInput.focus(), 150);
        }
      });

      async function doSend(){
        const text = chatInput.value;
        if (!text.trim()) return;
        chatInput.value = '';
        if (window.MindMeshSFX) window.MindMeshSFX.playClick();
        await sendMessage(otherUid, text);

        if (typingIndicator) {
          setTimeout(() => {
            typingIndicator.style.display = 'block';
            chatMessages.scrollTop = chatMessages.scrollHeight;
          }, 500);
        }
      }
      chatSend.addEventListener('click', (e) => { e.stopPropagation(); doSend(); });
      chatInput.addEventListener('click', (e) => e.stopPropagation());
      chatInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSend(); });
    });
  }

  subscribeMyThreads(renderInbox);
})();
</script>
</body>
